<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Na Avenida Beer e Assados da Alice. Escolha sua experiência.">
  <title>Na Avenida Beer · Assados da Alice</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: #080808; color: #fff; font-family: Arial, sans-serif; display: grid; place-items: center; padding: 32px 20px; }
    body { isolation: isolate; }
    main { width: min(100%, 440px); }
    h1 { font-size: 15px; font-weight: 400; letter-spacing: .16em; text-transform: uppercase; text-align: center; color: #aaa; margin: 0 0 32px; }
    nav { display: grid; gap: 20px; }
    .brand { width: 100%; min-height: 104px; border-radius: 12px; padding: 24px; display: flex; align-items: center; justify-content: center; font-size: clamp(20px, 5vw, 26px); font-weight: 700; text-decoration: none; text-align: center; line-height: 1.3; border: 1px solid; }
    .beer { background: linear-gradient(135deg, #191713, #090909); color: #e4c37c; border-color: #b58e42; box-shadow: inset 0 1px 0 rgba(228,195,124,.12); }
    .alice { background: #fff; color: #b91c2c; border-color: #fff; }
    .brand:focus-visible { outline: 3px solid #fff; outline-offset: 6px; }
    .brand { flex-direction: column; gap: 8px; }
    .brand { border-radius: 18px; min-height: 112px; letter-spacing: -.02em; }
    .hours { font-size: 14px; font-weight: 400; letter-spacing: .02em; }
    .brand[aria-disabled="true"] { cursor: default; }
    .notice { margin: 28px 0 0; color: #888; font-size: 14px; text-align: center; }
    @media (max-width: 480px) { .brand { min-height: 104px; padding: 22px 16px; } }
    .brand.beer { position: relative; padding: 0; overflow: hidden; display: grid; grid-template-columns: 1fr; isolation: isolate; }
    .beer::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent 20%, rgba(0,0,0,.65) 40%, rgba(0,0,0,.65) 60%, transparent 80%); z-index: 1; pointer-events: none; }
    .beer > span { position: absolute; left: 0; right: 0; z-index: 2; padding: 0 10px; text-shadow: 0 2px 6px #000; }
    .beer > span:first-of-type { top: 50%; transform: translateY(-100%); font-size: clamp(18px, 4.5vw, 24px); }
    .beer > .hours { top: 50%; margin-top: 8px; font-size: 13px; }
    .beer img { display: block; width: 100%; aspect-ratio: 3.53 / 1; height: auto; object-fit: cover; object-position: center; margin-bottom: 0; }
    .brand.alice { position: relative; padding: 0; overflow: hidden; display: grid; grid-template-columns: 1fr; isolation: isolate; color: #fff; border-color: #d7a530; }
    .alice img { display: block; width: 100%; aspect-ratio: 3.53 / 1; height: auto; object-fit: cover; object-position: center; }
    .alice::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent 20%, rgba(70,0,0,.65) 40%, rgba(70,0,0,.65) 60%, transparent 80%); z-index: 1; pointer-events: none; }
    .alice > span { position: absolute; left: 0; right: 0; z-index: 2; padding: 0 10px; text-shadow: 0 2px 6px #500; }
    .alice > span:first-of-type { top: 50%; transform: translateY(-100%); font-size: clamp(18px, 4.5vw, 24px); }
    .alice > .hours { top: 50%; margin-top: 8px; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <nav aria-label="Nossas empresas">
      <!-- Quando os sites estiverem prontos, adicione href com o destino e remova aria-disabled e tabindex. -->
      <a class="brand beer" href="https://naavenidabeer-tfy9.vercel.app/"><img src="na-avenida-banner.png" alt="" width="1984" height="800"><span>Na Avenida Beer</span><span class="hours">Cardápio · 18h às 6h</span></a>
      <a class="brand alice" href="https://foodzap.app.br/menu/assadosdaalicenaavenidabeer"><img src="assados-alice-banner.png" alt="" width="1984" height="800"><span>Assados da Alice</span><span class="hours">Cardápio · 6h30 às 18h</span></a>
    </nav>
  </main>
</body>
</html>
